<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 -2 1200 500" role="img"
     aria-label="Qué construyo: sistemas multiagente, servidores MCP, RAG y datos, IA de voz e infraestructura propia.">
  <title>Qué construyo</title>
  <style>.card rect:first-child{animation:edge 6s ease-in-out infinite}@keyframes edge{0%,100%{stroke-opacity:.7}50%{stroke-opacity:1}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#040915"/><stop offset="0.55" stop-color="#071226"/><stop offset="1" stop-color="#0A1A36"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/><stop offset="0.5" stop-color="#3B82F6"/><stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.55"/><stop offset="0.5" stop-color="#3B82F6" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity="0.45"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#3B82F6" stroke-opacity="0.07"/>
    </pattern>
    <linearGradient id="cardbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0D1A33"/><stop offset="1" stop-color="#0A1324"/></linearGradient>
  </defs>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif"><g transform="translate(0 0)" class="card" style="animation-delay:0.00s"><rect width="376" height="230" rx="20" fill="url(#cardbg)" stroke="url(#border)" stroke-width="1.2"/><rect x="28" y="26" width="48" height="48" rx="14" fill="#22D3EE" fill-opacity="0.08" stroke="#22D3EE" stroke-opacity="0.35"/><g transform="translate(40 38)"><g fill="none" stroke="#22D3EE" stroke-width="2"><circle cx="12" cy="6" r="3.2"/><circle cx="5" cy="18" r="3.2"/><circle cx="19" cy="18" r="3.2"/><path d="M10.4 8.7 6.6 15.3M13.6 8.7l3.8 6.6M8.2 18h7.6"/></g></g><text x="92" y="59" font-size="22" font-weight="700" fill="#F1F5F9">Sistemas multiagente</text><text x="28" y="122" font-size="18" fill="#A5B4C8">Agentes que planean, construyen,</text><text x="28" y="149" font-size="18" fill="#A5B4C8">revisan y operan, con traspasos,</text><text x="28" y="176" font-size="18" fill="#A5B4C8">memoria compartida y evidencia</text><text x="28" y="203" font-size="18" fill="#A5B4C8">de cada ejecución.</text></g><g transform="translate(412 0)" class="card" style="animation-delay:0.25s"><rect width="376" height="230" rx="20" fill="url(#cardbg)" stroke="url(#border)" stroke-width="1.2"/><rect x="28" y="26" width="48" height="48" rx="14" fill="#22D3EE" fill-opacity="0.08" stroke="#22D3EE" stroke-opacity="0.35"/><g transform="translate(40 38)"><g fill="none" stroke="#22D3EE" stroke-width="2" stroke-linecap="round"><path d="M9 3v5M15 3v5"/><rect x="6" y="8" width="12" height="6" rx="2"/><path d="M12 14v3a4 4 0 0 1-4 4"/></g></g><text x="92" y="59" font-size="22" font-weight="700" fill="#F1F5F9">Servidores MCP</text><text x="28" y="122" font-size="18" fill="#A5B4C8">Conecto herramientas, datos e</text><text x="28" y="149" font-size="18" fill="#A5B4C8">infraestructura con Claude, ChatGPT</text><text x="28" y="176" font-size="18" fill="#A5B4C8">y otros agentes, con OAuth 2.1.</text></g><g transform="translate(824 0)" class="card" style="animation-delay:0.50s"><rect width="376" height="230" rx="20" fill="url(#cardbg)" stroke="url(#border)" stroke-width="1.2"/><rect x="28" y="26" width="48" height="48" rx="14" fill="#22D3EE" fill-opacity="0.08" stroke="#22D3EE" stroke-opacity="0.35"/><g transform="translate(40 38)"><g fill="none" stroke="#22D3EE" stroke-width="2"><ellipse cx="12" cy="5.5" rx="7" ry="2.8"/><path d="M5 5.5v6c0 1.6 3.1 2.8 7 2.8s7-1.2 7-2.8v-6"/><path d="M5 11.5v6c0 1.6 3.1 2.8 7 2.8s7-1.2 7-2.8v-6"/></g></g><text x="92" y="59" font-size="22" font-weight="700" fill="#F1F5F9">RAG y datos</text><text x="28" y="122" font-size="18" fill="#A5B4C8">Ingesta de documentos, embeddings</text><text x="28" y="149" font-size="18" fill="#A5B4C8">y búsqueda sobre PostgreSQL</text><text x="28" y="176" font-size="18" fill="#A5B4C8">con pgvector.</text></g><g transform="translate(206 266)" class="card" style="animation-delay:0.75s"><rect width="376" height="230" rx="20" fill="url(#cardbg)" stroke="url(#border)" stroke-width="1.2"/><rect x="28" y="26" width="48" height="48" rx="14" fill="#22D3EE" fill-opacity="0.08" stroke="#22D3EE" stroke-opacity="0.35"/><g transform="translate(40 38)"><g stroke="#22D3EE" stroke-width="2.2" stroke-linecap="round"><path d="M3 10v4M7 7v10M11 4v16M15 8v8M19 6v12M23 10v4"/></g></g><text x="92" y="59" font-size="22" font-weight="700" fill="#F1F5F9">IA de voz</text><text x="28" y="122" font-size="18" fill="#A5B4C8">Agentes de voz, síntesis con</text><text x="28" y="149" font-size="18" fill="#A5B4C8">clonación de voz y una central</text><text x="28" y="176" font-size="18" fill="#A5B4C8">telefónica con IA.</text></g><g transform="translate(618 266)" class="card" style="animation-delay:1.00s"><rect width="376" height="230" rx="20" fill="url(#cardbg)" stroke="url(#border)" stroke-width="1.2"/><rect x="28" y="26" width="48" height="48" rx="14" fill="#22D3EE" fill-opacity="0.08" stroke="#22D3EE" stroke-opacity="0.35"/><g transform="translate(40 38)"><g fill="none" stroke="#22D3EE" stroke-width="2"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><circle cx="7.5" cy="6.5" r="1" fill="#22D3EE"/><circle cx="7.5" cy="17.5" r="1" fill="#22D3EE"/><path d="M12 6.5h5M12 17.5h5"/></g></g><text x="92" y="59" font-size="22" font-weight="700" fill="#F1F5F9">Infraestructura propia</text><text x="28" y="122" font-size="18" fill="#A5B4C8">Servidores con Docker, inicio de</text><text x="28" y="149" font-size="18" fill="#A5B4C8">sesión único, almacenamiento de</text><text x="28" y="176" font-size="18" fill="#A5B4C8">objetos, observabilidad e</text><text x="28" y="203" font-size="18" fill="#A5B4C8">integración continua.</text></g></g>
</svg>
