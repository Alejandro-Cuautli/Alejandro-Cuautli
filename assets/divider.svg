<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24" role="presentation">
  <style>.pulse{animation:run 6s linear infinite}@keyframes run{from{transform:translateX(-200px)}to{transform:translateX(1400px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
  <defs>
    <linearGradient id="l" x1="0" x2="1"><stop offset="0" stop-color="#3B82F6" stop-opacity="0"/><stop offset="0.5" stop-color="#3B82F6" stop-opacity="0.6"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></linearGradient>
    <radialGradient id="p"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
  </defs>
  <rect x="0" y="11.5" width="1200" height="1" fill="url(#l)"/>
  <circle cx="600" cy="12" r="3.5" fill="#22D3EE"/>
  <circle class="pulse" cx="0" cy="12" r="10" fill="url(#p)"/>
</svg>
